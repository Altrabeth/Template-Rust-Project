[package]
name = "template-rust-project"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
