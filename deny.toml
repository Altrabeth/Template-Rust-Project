# Configuration for `cargo deny check`. Only values that differ from the defaults are listed.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "allow"

# Own crates are `publish = false` and therefore need no license
[licenses.private]
ignore = true

[bans]
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
